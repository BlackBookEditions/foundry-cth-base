      content: |-
        <div class="journal-page-coc-base">
          <h2>Introduction</h2>

          <p class="lettrine">
            Chroniques Oubliées Cthulhu Origines (CTH) est un module qui adapte le module <strong>Chroniques Oubliées Contemporain 2ᵉ édition (COC2)</strong> aux règles de Cthulhu
            Origines. Il ne remplace ni COC2 ni le système : il se pose par-dessus. La chaîne complète est la suivante : le système <strong>Chroniques Oubliées 2ᵉ édition (CO2)</strong>,
            puis le module <strong>coc2-base</strong>, puis ce module, <strong>cth-base</strong>. Les deux premiers doivent être installés et activés.
          </p>

          <p class="alinea">
            Ce guide ne couvre donc que ce qui est <strong>spécifique à Cthulhu Origines</strong> : le vocabulaire de l'univers, l'Échelle de conscience, le Rang d'horreur des créatures,
            les états propres à CTH et les compendiums. Pour tout le reste (échelle de santé, tranches d'âge, progression, archétypes des adversaires, Bonus Critique…), reportez-vous au
            <strong>Guide du module COC2</strong>, fourni par coc2-base ; pour le fonctionnement générique des Actions, Effets et jets, à la documentation du système CO2.
          </p>

          <div class="encart">
            <h3>Sommaire du guide</h3>
            <ul>
              <li class="sans-puce"><strong>Les Acteurs</strong> — Échelle de santé, Échelle de conscience et ses paliers, fiche Adversaire (Rang d'horreur, conscience des antagonistes).</li>
              <li class="sans-puce"><strong>Les Objets</strong> — Compendiums CTH Témoin et CTH Archiviste, renvois aux pages des livres, automatisations fournies.</li>
              <li class="sans-puce"><strong>Les Jets et les Messages</strong> — États propres à CTH, modificateurs de conscience dans la fenêtre de jet, test de prise de conscience.</li>
              <li class="sans-puce"><strong>Autres fonctionnalités</strong> — Notes de version, thème visuel, réglage retiré, points d'extension pour les autres modules.</li>
            </ul>
          </div>

          <h3>Compendiums fournis</h3>
          <p class="alinea">Le module fournit trois compendiums :</p>
          <ul>
            <li class="sans-puce"><strong>CTH Témoin</strong> — voies de base, capacités, armes, armures et équipement du Livre du Témoin. Accessible aux joueurs.</li>
            <li class="sans-puce"><strong>CTH Archiviste</strong> — magie mondaine, artefacts, rituels et sortilèges du Livre de l'Archiviste. <strong>Réservé au MJ</strong> : les joueurs ne le voient pas.</li>
            <li class="sans-puce"><strong>CTH Guide du module</strong> — ce guide.</li>
          </ul>
          <p class="alinea">
            Les objets des deux premiers compendiums n'ont <strong>pas de texte descriptif</strong> : leur description indique seulement la page du livre où ils sont décrits (par exemple
            « Livre du Témoin page 74 »). Il faut donc disposer des livres pour jouer.
          </p>
        </div>
