  - sort: 200000
    name: Les Acteurs
    type: text
    _id: xPwQzUwLYw109xz4
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-coc-base">
          <h2>Les Acteurs</h2>

          <h3>Échelle de santé</h3>
          <p class="alinea">
            L'échelle de santé est celle de COC2, avec ses 20 échelons et ses 4 états. Seul le vocabulaire change : l'état atteint au 20ᵉ échelon s'appelle <strong>Meurtri</strong> au lieu
            de « Mourant », sur la fiche comme sur le statut posé sur le token. Ses effets sont inchangés.
          </p>

          <h3>Échelle de conscience</h3>
          <p class="alinea">
            L'Échelle de conscience mesure l'exposition du Témoin au folklore des collines. C'est la seconde échelle de COC2 (« Échelle d'évolution »), renommée et
            <strong>toujours affichée</strong> : un ruban de 20 échelons sous l'échelle de santé, sur la fiche de personnage comme sur la mini-fiche. Un clic sur un échelon coche l'échelle
            jusqu'à lui ; un clic sur le dernier échelon coché le décoche.
          </p>
          <p class="alinea">Quatre paliers donnent un état, affiché sous le ruban, et des modificateurs fixés par les règles de Cthulhu Origines :</p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="4">Paliers de l'Échelle de conscience</td>
              </tr>
              <tr class="tableau-entete">
                <td>Échelon</td>
                <td>État</td>
                <td>Tests de VOL face aux traumatismes</td>
                <td>Tests de CHA liés à l'empathie</td>
              </tr>
              <tr>
                <td>5</td>
                <td>Profane</td>
                <td>+1</td>
                <td>-1</td>
              </tr>
              <tr>
                <td>10</td>
                <td>Initié</td>
                <td>+3</td>
                <td>-3</td>
              </tr>
              <tr>
                <td>15</td>
                <td>Éveillé</td>
                <td>+5</td>
                <td>-5</td>
              </tr>
              <tr>
                <td>20</td>
                <td>Illuminé</td>
                <td>+10</td>
                <td>-10</td>
              </tr>
            </tbody>
          </table>
          <p class="alinea">
            Ces modificateurs ne sont jamais appliqués d'office : ils apparaissent dans la fenêtre de jet des tests de Volonté et de Charisme (voir <em>Les Jets et les Messages</em>).
            Aucun statut n'est posé sur le token.
          </p>
          <div class="indications-mj">
            Le menu « Configurer l'échelle » de COC2, qui permet de choisir librement les modificateurs de la seconde échelle, n'est pas disponible en Cthulhu Origines : le profil
            ci-dessus est imposé par le module.
          </div>

          <h3>Fiche Adversaire</h3>
          <p class="alinea">
            La fiche Rencontre de COC2 est remplacée par une fiche <strong>Adversaire (Cthulhu)</strong>, sélectionnée par défaut. Elle garde le fonctionnement de COC2 (archétype pour un
            adversaire humain, taille pour une créature) et ajoute deux notions de Cthulhu Origines.
          </p>

          <h4>Rang d'horreur des créatures</h4>
          <p class="alinea">
            Une créature (adversaire sans archétype) reçoit un <strong>Rang</strong> de 1 à 5, choisi dans l'en-tête de la fiche en mode Édition. Il est indépendant de la Taille : les deux
            coexistent, comme sur les profils du bestiaire (« TAI 5 · RANG 4 »). Le sélecteur de taille est d'ailleurs préfixé « Taille … » pour les distinguer. Le Rang détermine :
          </p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="4">Rang d'horreur</td>
              </tr>
              <tr class="tableau-entete">
                <td>Rang</td>
                <td>Test de VOL de prise de conscience</td>
                <td>Échec critique</td>
                <td>Rituels d'appel et de protection</td>
              </tr>
              <tr>
                <td>1</td>
                <td>difficulté 5</td>
                <td>1</td>
                <td>difficulté 5</td>
              </tr>
              <tr>
                <td>2</td>
                <td>difficulté 10</td>
                <td>1-2</td>
                <td>difficulté 10</td>
              </tr>
              <tr>
                <td>3</td>
                <td>difficulté 15</td>
                <td>1-3</td>
                <td>difficulté 15</td>
              </tr>
              <tr>
                <td>4</td>
                <td>difficulté 20</td>
                <td>1-4</td>
                <td>difficulté 20</td>
              </tr>
              <tr>
                <td>5</td>
                <td>difficulté 25</td>
                <td>1-5</td>
                <td>difficulté 25</td>
              </tr>
            </tbody>
          </table>
          <p class="alinea">
            En mode Lecture, l'en-tête affiche « Rang X ». Son infobulle rappelle ces trois valeurs, et l'icône de d20 placée à côté lance le test de prise de conscience (voir <em>Les
            Jets et les Messages</em>). Cette icône n'apparaît qu'à ceux qui peuvent modifier la fiche, c'est-à-dire en pratique au MJ.
          </p>

          <h4>Échelle de conscience des antagonistes</h4>
          <p class="alinea">
            Un antagoniste humain (adversaire avec archétype) porte lui aussi une Échelle de conscience, affichée sous son échelle de santé et utilisable comme celle des personnages, avec
            les mêmes paliers et les mêmes modificateurs. Les profils du livre l'indiquent sous la forme « Échelle de conscience 5/20 (Profane) ».
          </p>

          <h4>Aides à la création</h4>
          <p class="alinea">
            COC2 affiche en permanence, en mode Édition, le décompte des points de caractéristiques et des capacités prévus par le profil de l'adversaire. Cthulhu Origines ne l'affiche
            <strong>qu'en cas d'écart</strong> : total de points différent du budget, caractéristique au-delà du plafond, ou nombre de capacités différent de celui prévu. Si tout est
            conforme, rien ne s'affiche. Comme dans COC2, un écart n'empêche jamais d'enregistrer la fiche.
          </p>
        </div>
