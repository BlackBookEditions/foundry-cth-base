  - sort: 400000
    name: Les Jets et les Messages
    type: text
    _id: uDmnz5sdiuFhz5Ut
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-coc-base">
          <h2>Les Jets et les Messages</h2>

          <h3>États préjudiciables propres à Cthulhu Origines</h3>
          <p class="alinea">
            Trois états sont redéfinis selon les règles de Cthulhu Origines. Ils se posent sur le token comme les autres statuts. Une partie de leurs effets est appliquée
            automatiquement, le reste est à gérer à la table.
          </p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="3">États de Cthulhu Origines</td>
              </tr>
              <tr class="tableau-entete">
                <td>État</td>
                <td>Appliqué automatiquement</td>
                <td>Proposé ou à gérer à la table</td>
              </tr>
              <tr>
                <td>Aveuglé</td>
                <td>-5 en Initiative et en Défense.</td>
                <td>
                  -10 aux actions basées sur la vue, proposé à cocher dans la fenêtre de jet. La réduction à -5 après un test de Perception réussi reste à appliquer à la main.
                </td>
              </tr>
              <tr>
                <td>Étourdi</td>
                <td>-5 en Défense.</td>
                <td>Aucune action possible.</td>
              </tr>
              <tr>
                <td>Immobilisé</td>
                <td>-5 en Défense et déplacement nul (effets de COC2), et toute attaque contre le personnage est automatiquement une réussite critique.</td>
                <td>Aucune action physique possible.</td>
              </tr>
            </tbody>
          </table>
          <p class="alinea">
            L'état <strong>Inconscient</strong> n'existe pas en Cthulhu Origines : il est remplacé par Immobilisé. Toute capacité ou tout effet hérité de COC2 qui poserait Inconscient
            pose donc Immobilisé à la place.
          </p>

          <h3>L'Échelle de conscience dans la fenêtre de jet</h3>
          <p class="alinea">
            Dès qu'un personnage ou un antagoniste humain a atteint un palier de l'Échelle de conscience, ses tests de caractéristique proposent une ligne supplémentaire dans la fenêtre
            de jet :
          </p>
          <ul>
            <li class="sans-puce">
              <strong>Test de VOL</strong> — le bonus du palier (+1, +3, +5 ou +10), libellé « Événements traumatisants ». Il n'est coché d'avance que pour un test de prise de
              conscience lancé depuis une fiche Adversaire ; pour tout autre test de VOL, cochez-le si le test porte bien sur un événement traumatisant.
            </li>
            <li class="sans-puce">
              <strong>Test de CHA</strong> — le malus du palier (-1, -3, -5 ou -10), libellé « Empathie ». Il n'est jamais coché d'avance : c'est au joueur ou au MJ de juger si l'action
              relève de l'empathie.
            </li>
          </ul>
          <div class="exemple">
            Un Témoin Initié (10 échelons cochés) tente de réconforter un témoin choqué : la fenêtre de son test de Charisme propose une case « Empathie -3 », que le MJ fait cocher. S'il
            marchande avec un antiquaire, la case reste décochée.
          </div>

          <h3>Test de prise de conscience</h3>
          <p class="alinea">
            Face à une créature du folklore, les Témoins font un test de VOL dont la difficulté dépend du Rang de la créature (voir <em>Les Acteurs</em>). Pour le lancer :
          </p>
          <ul>
            <li class="sans-puce"><strong>1.</strong> Ciblez les tokens des Témoins concernés.</li>
            <li class="sans-puce"><strong>2.</strong> Ouvrez la fiche de la créature en mode Lecture et cliquez sur l'icône de d20 à côté de « Rang X ».</li>
          </ul>
          <p class="alinea">
            Chaque Témoin ciblé fait alors un test de VOL à la bonne difficulté, avec le bonus de son palier de conscience déjà coché. Le message de chat rappelle le nom de la créature
            et la difficulté. Sans Rang renseigné ou sans cible, un avertissement s'affiche et aucun test n'est lancé.
          </p>
        </div>
