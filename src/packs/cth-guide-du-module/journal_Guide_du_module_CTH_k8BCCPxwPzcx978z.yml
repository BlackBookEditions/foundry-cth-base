    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-coc-base">
          <h2>Les Objets</h2>

          <p class="alinea">
            Les objets de Cthulhu Origines sont fournis dans deux compendiums. Aucun ne reprend le texte des livres : la description de chaque objet indique la page où il est décrit,
            dans le <strong>Livre du Témoin</strong> ou dans le <strong>Livre de l'Archiviste</strong>. Quand un objet s'étend sur plusieurs pages, ou qu'il a une description et une ligne
            dans un tableau, toutes les pages sont citées (par exemple « Livre du Témoin pages 100 et 102 »).
          </p>

          <h3>CTH Témoin</h3>
          <p class="alinea">Accessible aux joueurs, ce compendium reprend le Livre du Témoin :</p>
          <ul>
            <li class="sans-puce"><strong>Voies</strong> — les 18 voies de base, dans l'ordre du livre.</li>
            <li class="sans-puce"><strong>Capacités</strong> — un dossier par voie, avec ses 5 capacités (rangs 1 à 5). Chaque capacité est déjà reliée à sa voie.</li>
            <li class="sans-puce"><strong>Armes</strong> — armes de contact, de trait, de lancer, armes à feu et explosifs.</li>
            <li class="sans-puce"><strong>Armures</strong> — le gilet rembourré, seule protection décrite par le livre.</li>
            <li class="sans-puce"><strong>Équipement divers</strong> — objets courants et kits complets.</li>
          </ul>

          <h3>CTH Archiviste</h3>
          <p class="alinea">Ce compendium reprend le Livre de l'Archiviste. Il est <strong>réservé au MJ</strong> : les joueurs ne le voient pas dans l'onglet Compendiums.</p>
          <ul>
            <li class="sans-puce"><strong>Voies de la magie mondaine</strong> et <strong>Magie mondaine</strong> — les 14 voies et leurs capacités, un dossier par voie.</li>
            <li class="sans-puce"><strong>Artefacts</strong> — les 10 artefacts du folklore des collines, sous forme d'équipement.</li>
            <li class="sans-puce"><strong>Rituels</strong> — un dossier par rituel (appel, ouverture de portail, protection), avec un objet par rang, de 1 à 5.</li>
            <li class="sans-puce"><strong>Sortilèges</strong> — un dossier par rang, de 1 à 5.</li>
          </ul>
          <p class="alinea">
            Un rituel s'apprend pour un rang donné : c'est pourquoi chaque rang est un objet distinct (« Rituel d'appel (rang 3) »). Rituels et sortilèges sont des capacités hors voie,
            avec leur rang et le type d'action limitée ; les sortilèges sont en plus marqués comme sorts.
          </p>
          <div class="indications-mj">
            Pour donner un sortilège, un rituel ou un artefact à un joueur, glissez-le depuis le compendium sur sa fiche : l'objet est copié sur le personnage, sans que le joueur ait accès
            au reste du compendium.
          </div>

          <h3>Ce qui est automatisé</h3>
          <ul>
            <li class="sans-puce">
              <strong>Capacités des voies de base</strong> — seuls les bonus nets sont encodés : hausses de caractéristique sans choix, bonus d'attaque, de dommages, d'Initiative et de
              critique, et bonus aux tests de caractéristique. Ces derniers sont proposés à cocher dans la fenêtre de jet, car ils ne valent que dans certaines circonstances. Les bonus
              de palier de l'Échelle de conscience, les dés bonus et les substitutions de caractéristique restent à gérer à la main.
            </li>
            <li class="sans-puce">
              <strong>Armes</strong> — attaque au contact (ATC) ou à distance (ATD), dommages, portée et nombre de munitions. Le fusil de précision ajoute la PER à l'attaque et aux
              dommages ; le grand maillet impose -4 en Initiative quand il est équipé.
            </li>
            <li class="sans-puce"><strong>Gilet rembourré</strong> — RD 3 quand il est équipé.</li>
            <li class="sans-puce"><strong>Pierre de vision</strong> — +3 aux tests de PER quand elle est équipée, proposé à cocher dans la fenêtre de jet.</li>
          </ul>

          <h3>Ce qui ne l'est pas</h3>
          <ul>
            <li class="sans-puce">Le bonus critique et la cadence de tir des armes n'ont pas d'équivalent dans le système : reportez-vous au livre.</li>
            <li class="sans-puce">Les explosifs n'ont pas d'attaque, faute de caractéristiques chiffrées dans le livre.</li>
            <li class="sans-puce">
              Le système n'accepte que des prix entiers : les prix inférieurs au dollar ou avec des cents sont arrondis au dollar supérieur. Les objets sans prix dans le livre sont à 0 $.
            </li>
            <li class="sans-puce">Vêtements, bijoux, services et véhicules ne sont pas repris.</li>
            <li class="sans-puce">Artefacts, rituels et sortilèges n'ont pas d'effet automatique, en dehors de la Pierre de vision.</li>
          </ul>
        </div>
